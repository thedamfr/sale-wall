apiVersion: v1
kind: ResourceQuota
metadata:
  name: site-saletesincere
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "5"
    limits.memory: 6Gi
    # Cible après migration : deux bases de 1Gi et une restauration de 1Gi.
    # Ne pas appliquer aux PVC historiques de 4Gi avant leur migration.
    persistentvolumeclaims: "3"
    requests.storage: 3Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: site-saletesincere
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
